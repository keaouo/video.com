<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<!-- ✅ 禁止缩放 + 安全区 -->
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<title>视频播放器</title>

<style>
/* ===== 基础 ===== */
body {
    margin: 0;
    padding: env(safe-area-inset-top, 12px)
             env(safe-area-inset-right, 12px)
             env(safe-area-inset-bottom, 24px)
             env(safe-area-inset-left, 12px);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: #f2f2f7;
    height: 100vh;
    box-sizing: border-box;
}

.container {
    display: flex;
    flex-direction: column;
    height: 100%;
}

h2 {
    font-size: 18px;
    margin: 0 0 10px;
}

/* ===== 视频列表 ===== */
.video-list {
    background: #fff;
    border-radius: 10px;
    overflow-y: auto;
    max-height: 160px;
    margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

/* ✅ 列表项：居中 + 颜色区分 */
.video-item {
    display: flex;
    align-items: center;          /* ✅ 垂直居中 */
    padding: 12px 14px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
}

.video-item:last-child {
    border-bottom: none;
}

/* ✅ 5 种颜色循环 */
.color-0 { background: #ffecec; }
.color-1 { background: #fff4e5; }
.color-2 { background: #ecf9ff; }
.color-3 { background: #eef9f0; }
.color-4 { background: #f4ecff; }

/* ✅ 选中状态（绿色） */
.video-item.active {
    background: #d4f8dc !important;
    font-weight: bold;
}

/* ===== 视频播放器 ===== */
.player {
    flex: 1;
    min-height: 0;   /* ✅ 关键：防止溢出 */
    background: #000;
    border-radius: 10px;
    overflow: hidden;
}

video, iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* ===== 移动端优化 ===== */
@media (max-width: 768px) {
    h2 {
        font-size: 16px;
    }

    .video-item {
        font-size: 13px;
        padding: 10px 12px;
    }

    .video-list {
        max-height: 140px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h2>📄 视频列表</h2>

    <div class="video-list" id="videoList">
        加载中...
    </div>

    <div class="player" id="player"></div>
</div>

<script>
const txtUrl = "video.txt";

fetch(txtUrl)
.then(res => res.text())
.then(text => {
    let lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    lines = lines.slice(0, 5); // ✅ 最多 5 个

    const listEl = document.getElementById("videoList");
    listEl.innerHTML = "";

    if (!lines.length) {
        listEl.innerText = "未找到视频链接";
        return;
    }

    lines.forEach((url, index) => {
        const div = document.createElement("div");
        div.className = `video-item color-${index}`;
        div.innerText = `点击播放第 ${index + 1} 个视频`;
        div.dataset.url = url;

        div.onclick = () => {
            document.querySelectorAll(".video-item")
                .forEach(i => i.classList.remove("active"));
            div.classList.add("active");
            playVideo(url);
        };

        listEl.appendChild(div);
    });

    // ✅ 默认选中第一个
    listEl.firstChild.classList.add("active");
    playVideo(lines[0]);
})
.catch(err => {
    document.getElementById("videoList").innerText =
        "无法加载 txt 文件（请用 Live Server）";
});

function playVideo(url) {
    const player = document.getElementById("player");

    if (url.endsWith(".m3u8")) {
        player.innerHTML = `
            <video controls autoplay playsinline>
                <source src="${url}" type="application/x-mpegURL">
            </video>
        `;
    } else if (url.includes("http") && !url.endsWith(".mp4")) {
        player.innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;
    } else {
        player.innerHTML = `
            <video controls autoplay playsinline>
                <source src="${url}" type="video/mp4">
            </video>
        `;
    }
}
</script>

</body>
</html>
