<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TXT 视频链接播放器</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 20px;
    }

    h2 {
        color: #333;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    .video-list {
        margin-bottom: 20px;
    }

    .video-item {
        padding: 10px;
        background: #fff;
        border: 1px solid #ddd;
        margin-bottom: 8px;
        cursor: pointer;
    }

    .video-item:hover {
        background: #eef;
    }

    video, iframe {
        width: 100%;
        height: 450px;
        border: none;
        background: #000;
    }
</style>
</head>

<body>

<div class="container">
    <h2>📄 TXT 视频链接播放器</h2>

    <div class="video-list" id="videoList">
        加载中...
    </div>

    <div id="player"></div>
</div>

<script>
// TXT 文件路径（与 HTML 同目录）
const txtUrl = "video.txt";

fetch(txtUrl)
.then(res => res.text())
.then(text => {
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    const listEl = document.getElementById("videoList");
    listEl.innerHTML = "";

    if (lines.length === 0) {
        listEl.innerText = "未找到视频链接";
        return;
    }

    lines.forEach(url => {
        const div = document.createElement("div");
        div.className = "video-item";
        div.innerText = url;
        div.onclick = () => playVideo(url);
        listEl.appendChild(div);
    });

    // 默认播放第一个
    playVideo(lines[0]);
})
.catch(err => {
    document.getElementById("videoList").innerText =
        "无法加载 txt 文件：" + err;
});

function playVideo(url) {
    const player = document.getElementById("player");

    if (url.endsWith(".m3u8")) {
        // HLS 视频
        player.innerHTML = `
            <video controls autoplay>
                <source src="${url}" type="application/x-mpegURL">
                您的浏览器不支持 HLS 播放
            </video>
        `;
    } else if (url.includes("http") && !url.endsWith(".mp4")) {
        // 外链（如 flv / 直播）
        player.innerHTML = `
            <iframe src="${url}" allowfullscreen></iframe>
        `;
    } else {
        // 普通 MP4
        player.innerHTML = `
            <video controls autoplay>
                <source src="${url}" type="video/mp4">
                您的浏览器不支持 video 标签
            </video>
        `;
    }
}
</script>

</body>
</html>
