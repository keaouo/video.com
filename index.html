<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<!-- ✅ 必须：Safari / iOS 自适应 -->
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>视频播放器</title>

<style>
/* ===== 基础样式 ===== */
body {
    margin: 0;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f2f7;
    color: #333;
}

.container {
    max-width: 960px;
    margin: auto;
}

h2 {
    font-size: 18px;
    margin-bottom: 10px;
}

/* ===== 视频列表 ===== */
.video-list {
    background: #fff;
    border-radius: 10px;
    overflow-y: auto;
    max-height: 220px;   /* ✅ 防止撑大 */
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

.video-item {
    padding: 12px 14px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    line-height: 1.4;
    cursor: pointer;

    /* ✅ 单行省略 */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.video-item:last-child {
    border-bottom: none;
}

.video-item:hover {
    background: #f0f0f5;
}

/* ===== 播放器区域 ===== */
.player {
    width: 100%;
    aspect-ratio: 16 / 9;   /* ✅ Safari 15+ 支持 */
    background: #000;
    border-radius: 10px;
    overflow: hidden;
}

/* ===== 视频元素 ===== */
video, iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* ===== iPhone / iPad 优化 ===== */
@media (max-width: 768px) {
    body {
        padding: 10px;
    }

    h2 {
        font-size: 16px;
    }

    .video-item {
        font-size: 13px;
        padding: 10px 12px;
    }

    .video-list {
        max-height: 180px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h2>📄 视频列表</h2>

    <div class="video-list" id="videoList">
        加载中...
    </div>

    <div class="player" id="player"></div>
</div>

<script>
const txtUrl = "video.txt";

fetch(txtUrl)
.then(res => res.text())
.then(text => {
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    const listEl = document.getElementById("videoList");
    listEl.innerHTML = "";

    if (!lines.length) {
        listEl.innerText = "未找到视频链接";
        return;
    }

    lines.forEach(url => {
        const div = document.createElement("div");
        div.className = "video-item";
        div.title = url;   // ✅ 长按可看完整链接
        div.innerText = url;
        div.onclick = () => playVideo(url);
        listEl.appendChild(div);
    });

    playVideo(lines[0]);
})
.catch(err => {
    document.getElementById("videoList").innerText =
        "无法加载 txt 文件（请用 Live Server）";
});

function playVideo(url) {
    const player = document.getElementById("player");

    if (url.endsWith(".m3u8")) {
        player.innerHTML = `
            <video controls autoplay playsinline>
                <source src="${url}" type="application/x-mpegURL">
            </video>
        `;
    } else if (url.includes("http") && !url.endsWith(".mp4")) {
        player.innerHTML = `
            <iframe src="${url}" allowfullscreen></iframe>
        `;
    } else {
        player.innerHTML = `
            <video controls autoplay playsinline>
                <source src="${url}" type="video/mp4">
            </video>
        `;
    }
}
</script>

</body>
</html>
