<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<!-- ✅ 禁止缩放 -->
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<title>视频播放器</title>

<style>
/* =========================
   基础重置
========================= */
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f2f2f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    overscroll-behavior: none;
}

/* =========================
   主体布局
========================= */
.container {
    height: 100%;
    padding:
        env(safe-area-inset-top, 12px)
        env(safe-area-inset-right, 12px)
        env(safe-area-inset-bottom, 20px)
        env(safe-area-inset-left, 12px);
    display: flex;
    flex-direction: column;
}

h2 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 10px;
    color: #000;
}

/* =========================
   列表（iOS 风格）
========================= */
.video-list {
    height: 150px;
    background: #fff;
    border-radius: 10px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

/* ✅ iOS 原生级列表项 */
.video-item {
    height: 44px;
    line-height: 44px;          /* ✅ 核心：单行绝对居中 */
    padding: 0 14px;
    font-size: 15px;
    color: #000;
    border-bottom: 1px solid #eee;
}

.video-item:last-child {
    border-bottom: none;
}

/* ✅ 5 色（更 iOS） */
.color-0 { background: #ffecec; }
.color-1 { background: #fff4e5; }
.color-2 { background: #ecf9ff; }
.color-3 { background: #eef9f0; }
.color-4 { background: #f4ecff; }

/* ✅ 选中态 */
.video-item.active {
    background: #d4f8dc !important;
    font-weight: 600;
}

/* =========================
   播放器区域
========================= */
.player {
    flex: 1;
    min-height: 0;
    margin-top: 10px;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
}

video, iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>

<div class="container">
    <h2>播放列表</h2>

    <div class="video-list" id="videoList">
        加载中...
    </div>

    <div class="player" id="player"></div>
</div>

<script>
/* =========================
   禁止多指缩放
========================= */
document.addEventListener("touchmove", e => {
    if (e.touches.length > 1) {
        e.preventDefault();
    }
}, { passive: false });

/* =========================
   加载 video.txt
========================= */
const txtUrl = "video.txt";

fetch(txtUrl)
.then(res => res.text())
.then(text => {
    const lines = text.split("\n")
                      .map(l => l.trim())
                      .filter(Boolean)
                      .slice(0, 5);

    const listEl = document.getElementById("videoList");
    listEl.innerHTML = "";

    if (!lines.length) {
        listEl.innerText = "未找到视频链接";
        return;
    }

    lines.forEach((url, index) => {
        const div = document.createElement("div");
        div.className = `video-item color-${index}`;
        div.textContent = `点击播放第 ${index + 1} 个视频`;

        div.onclick = () => {
            document.querySelectorAll(".video-item")
                .forEach(i => i.classList.remove("active"));
            div.classList.add("active");
            playVideo(url);
        };

        listEl.appendChild(div);
    });

    listEl.firstChild.classList.add("active");
    playVideo(lines[0]);
})
.catch(() => {
    document.getElementById("videoList").innerText =
        "无法加载 txt 文件（请用 Live Server）";
});

/* =========================
   播放器切换
========================= */
function playVideo(url) {
    const player = document.getElementById("player");

    if (url.endsWith(".m3u8")) {
        player.innerHTML = `
            <video controls autoplay playsinline>
                <source src="${url}" type="application/x-mpegURL">
            </video>
        `;
    } else if (url.includes("http") && !url.endsWith(".mp4")) {
        player.innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;
    } else {
        player.innerHTML = `
            <video controls autoplay playsinline>
                <source src="${url}" type="video/mp4">
            </video>
        `;
    }
}
</script>

</body>
</html>
