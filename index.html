<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<!-- ✅ 禁止缩放 -->
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<title>视频播放器</title>

<style>
/* =========================
   基础重置
========================= */
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f2f2f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    overscroll-behavior: none;
}

/* =========================
   主体布局
========================= */
.container {
    height: 100%;
    padding:
        env(safe-area-inset-top, 12px)
        env(safe-area-inset-right, 12px)
        env(safe-area-inset-bottom, 20px)
        env(safe-area-inset-left, 12px);
    display: flex;
    flex-direction: column;
}

h2 {
    font-size: 17px;
    margin: 0 0 10px;
    font-weight: 600;
    color: #1c1c1e;
}

/* =========================
   列表（修复居中核心）
========================= */
.video-list {
    height: 150px;
    background: #fff;
    border-radius: 10px;
    overflow-y: auto;
    padding: 0; /* 确保容器内无额外padding影响 */
}

/* ✅ 核心修复：每个列表项使用 Flex 完美居中 */
.video-item {
    height: 44px;
    /* 使用 Flex 布局 */
    display: flex;
    /* 垂直居中 */
    align-items: center;
    /* 水平居中（这是之前缺失的关键） */
    justify-content: center;
    
    font-size: 14px;
    border-bottom: 1px solid #eee;
    cursor: pointer; /* 增加点击手感 */
}

.video-item:last-child {
    border-bottom: none;
}

/* ✅ 5 色背景 */
.color-0 { background: #ffecec; }
.color-1 { background: #fff4e5; }
.color-2 { background: #ecf9ff; }
.color-3 { background: #eef9f0; }
.color-4 { background: #f4ecff; }

/* ✅ 选中状态 */
.video-item.active {
    background: #d4f8dc !important;
    font-weight: 600;
}

/* =========================
   播放器
========================= */
.player {
    flex: 1;
    min-height: 0;
    margin-top: 10px;
    height: calc(100% - 300px);
    background: #000;
    border-radius: 10px;
    overflow: hidden;
}

video, iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="player" id="player"></div>
  
    <div class="video-list" id="videoList">
        加载中...
    </div>

</div>

<script>
/* =========================
   ✅ 禁止双指 / 三指缩放
========================= */
document.addEventListener("touchmove", e => {
    if (e.touches.length > 1) {
        e.preventDefault();
    }
}, { passive: false });

/* =========================
   加载 TXT
========================= */
const txtUrl = "video.txt";

fetch(txtUrl)
.then(res => res.text())
.then(text => {
    const lines = text.split("\n")
                      .map(l => l.trim())
                      .filter(Boolean)
                      .slice(0, 3);

    const listEl = document.getElementById("videoList");
    listEl.innerHTML = "";

    if (!lines.length) {
        listEl.innerText = "未找到视频链接";
        return;
    }

    lines.forEach((url, index) => {
        const div = document.createElement("div");
        div.className = `video-item color-${index}`;

        /* ✅ 文本节点居中：通过 CSS 的 justify-content: center 实现 */
        div.textContent = `点击播放第 ${index + 1} 个视频`;

        div.onclick = () => {
            document.querySelectorAll(".video-item")
                .forEach(i => i.classList.remove("active"));
            div.classList.add("active");
            playVideo(url);
        };

        listEl.appendChild(div);
    });

    listEl.firstChild.classList.add("active");
    playVideo(lines[0]);
})
.catch(() => {
    document.getElementById("videoList").innerText =
        "无法加载 txt 文件（请用 Live Server）";
});

function playVideo(url) {
    const player = document.getElementById("player");

    if (url.endsWith(".m3u8")) {
        player.innerHTML = `
            <video controls autoplay playsinline>
                <source src="${url}" type="application/x-mpegURL">
            </video>
        `;
    } else if (url.includes("http") && !url.endsWith(".mp4")) {
        player.innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;
    } else {
        player.innerHTML = `
            <video controls autoplay playsinline>
                <source src="${url}" type="video/mp4">
            </video>
        `;
    }
}
</script>

</body>
</html>
