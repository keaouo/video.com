<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>视频播放器</title>

<style>
/* ===== 基础 ===== */
body {
    margin: 0;
    padding: env(safe-area-inset-top, 12px)
             env(safe-area-inset-right, 12px)
             env(safe-area-inset-bottom, 24px)
             env(safe-area-inset-left, 12px);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: #f2f2f7;
    height: 100vh;
    box-sizing: border-box;
}

.container {
    display: flex;
    flex-direction: column;
    height: 100%;
}

h2 {
    font-size: 18px;
    margin: 0 0 10px;
}

/* ===== 视频列表 ===== */
.video-list {
    background: #fff;
    border-radius: 10px;
    overflow-y: auto;
    max-height: 160px;   /* ✅ 固定高度 */
    margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

.video-item {
    padding: 12px 14px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    cursor: pointer;
}

.video-item:last-child {
    border-bottom: none;
}

.video-item:hover {
    background: #f0f0f5;
}

/* ===== 视频播放器 ===== */
.player {
    flex: 1;              /* ✅ 占满剩余空间 */
    background: #000;
    border-radius: 10px;
    overflow: hidden;
}

video, iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* ===== 移动端优化 ===== */
@media (max-width: 768px) {
    h2 {
        font-size: 16px;
    }

    .video-item {
        font-size: 13px;
        padding: 10px 12px;
    }

    .video-list {
        max-height: 140px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h2>📄 视频列表</h2>

    <div class="video-list" id="videoList">
        加载中...
    </div>

    <div class="player" id="player"></div>
</div>

<script>
const txtUrl = "video.txt";

fetch(txtUrl)
.then(res => res.text())
.then(text => {
    let lines = text.split("\n").map(l => l.trim()).filter(Boolean);

    // ✅ 最多 5 个
    lines = lines.slice(0, 5);

    const listEl = document.getElementById("videoList");
    listEl.innerHTML = "";

    if (!lines.length) {
        listEl.innerText = "未找到视频链接";
        return;
    }

    lines.forEach((url, index) => {
        const div = document.createElement("div");
        div.className = "video-item";
        div.innerText = `点击按钮播放第 ${index + 1} 个视频`;
        div.onclick = () => playVideo(url);
        listEl.appendChild(div);
    });

    // ✅ 默认播放第一个
    playVideo(lines[0]);
})
.catch(err => {
    document.getElementById("videoList").innerText =
        "无法加载 txt 文件（请用 Live Server）";
});

function playVideo(url) {
    const player = document.getElementById("player");

    if (url.endsWith(".m3u8")) {
        player.innerHTML = `
            <video controls autoplay playsinline>
                <source src="${url}" type="application/x-mpegURL">
            </video>
        `;
    } else if (url.includes("http") && !url.endsWith(".mp4")) {
        player.innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;
    } else {
        player.innerHTML = `
            <video controls autoplay playsinline>
                <source src="${url}" type="video/mp4">
            </video>
        `;
    }
}
</script>

</body>
</html>
